<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pachamama">
<title>Caja · Pachamama Culiparri</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ───────────────────────────────────────────────────── */
:root {
  --crema:    #F5EDE0;
  --crema2:   #EDE0CE;
  --borde:    #DDD0BB;
  --marron:   #2C1A0E;
  --marron2:  #7A5C3A;
  --marron3:  #A88660;
  --blanco:   #FFFFFF;
  --rojo:     #8B2318;
  --rojo-bg:  #F9F0EE;
  --verde:    #2d5a14;
  --font-display: 'Jost', sans-serif;
  --font-body:    'DM Sans', sans-serif;
}

/* ── RESET ───────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{font-family:var(--font-body);background:var(--crema);color:var(--marron);min-height:100vh;}
button,input,textarea,select{font-family:var(--font-body);font-size:16px;}

/* ── LOADING ─────────────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:var(--crema);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999;}
.spin{width:32px;height:32px;border:2px solid var(--borde);border-top-color:var(--marron);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* ── CARRITO BAR ─────────────────────────────────────────────── */
#cartBar{position:sticky;top:0;z-index:100;background:var(--marron);padding:13px 20px;justify-content:space-between;align-items:center;display:none;box-shadow:0 2px 16px rgba(44,26,14,.18);}
#cartBar.show{display:flex;animation:slideDown .2s ease;}
#cartInfo{color:var(--crema);font-size:14px;font-weight:400;letter-spacing:.3px;}
#cartBtn{background:var(--crema);color:var(--marron);border:none;border-radius:2px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.5px;font-family:var(--font-display);text-transform:uppercase;}

/* ── HEADER CATÁLOGO ─────────────────────────────────────────── */
.hdr{background:var(--crema);padding:40px 20px 28px;text-align:center;border-bottom:1px solid var(--borde);}
.logo-svg{margin:0 auto 20px;display:block;}
.logo-wordmark{font-family:var(--font-display);font-size:17px;font-weight:300;color:var(--marron);letter-spacing:6px;text-transform:uppercase;margin-bottom:4px;}
.logo-sub-wordmark{font-family:var(--font-display);font-size:24px;font-weight:300;color:var(--marron);letter-spacing:8px;text-transform:uppercase;margin-bottom:14px;}
.addr{font-size:12px;color:var(--marron3);letter-spacing:.5px;}

.main{max-width:640px;margin:0 auto;padding:0 16px 120px;}

/* ── FILTROS ─────────────────────────────────────────────────── */
.filters{display:flex;gap:6px;overflow-x:auto;padding:18px 0 14px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fBtn{flex-shrink:0;padding:7px 16px;border-radius:2px;border:1px solid var(--borde);background:var(--blanco);color:var(--marron2);font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;font-family:var(--font-display);letter-spacing:.5px;transition:all .15s;}
.fBtn:hover{border-color:var(--marron2);}

/* ── SECCIÓN PRODUCTOS ───────────────────────────────────────── */
.sec{margin-bottom:32px;}
.sec-hdr{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;padding-bottom:10px;}
.sec-lbl{font-family:var(--font-display);font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:500px){.grid{grid-template-columns:repeat(3,1fr);}}

/* ── TARJETA ─────────────────────────────────────────────────── */
.pcard{background:var(--blanco);border-radius:2px;border:1px solid var(--borde);transition:border-color .15s;overflow:hidden;}
.pcard:hover{border-color:var(--marron3);}
.pcard-img{width:100%;height:100px;object-fit:cover;display:block;}
.pcard-body{padding:12px;}
.pname{font-weight:500;font-size:13px;line-height:1.35;margin-bottom:3px;color:var(--marron);}
.pprice{font-size:11px;color:var(--marron3);margin-bottom:8px;font-family:var(--font-display);letter-spacing:.3px;}
.pdesc{font-size:11px;color:var(--marron2);line-height:1.5;margin-bottom:8px;}
.pdesc-short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ver-mas{font-size:11px;color:var(--marron2);font-weight:500;background:none;border:none;padding:0;cursor:pointer;margin-bottom:8px;display:block;text-decoration:underline;text-underline-offset:2px;}
.addBtn{width:100%;padding:9px;border-radius:2px;border:1px solid;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font-display);letter-spacing:1px;text-transform:uppercase;}
.qrow{display:flex;align-items:center;justify-content:space-between;}
.qbtn{width:32px;height:32px;border-radius:2px;border:1px solid;font-size:18px;font-weight:300;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.qval{font-weight:600;font-size:16px;font-family:var(--font-display);}

/* ── VISTAS ──────────────────────────────────────────────────── */
.view{display:none;}
.view.on{display:block;animation:fadeUp .25s ease;}
.back{background:none;border:none;color:var(--marron2);font-size:13px;padding:0;margin-bottom:20px;cursor:pointer;letter-spacing:.5px;font-family:var(--font-display);text-transform:uppercase;}
.sec-h{font-family:var(--font-display);font-size:20px;font-weight:300;color:var(--marron);margin-bottom:20px;letter-spacing:2px;text-transform:uppercase;}
.card{background:var(--blanco);border-radius:2px;border:1px solid var(--borde);padding:18px;margin-bottom:14px;}
.orow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--crema2);}
.ototal{display:flex;justify-content:space-between;padding-top:14px;font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--marron);letter-spacing:.5px;}
.lbl{display:block;font-size:10px;color:var(--marron3);text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;font-family:var(--font-display);}
.inp{width:100%;padding:12px 14px;background:var(--crema);border:1px solid var(--borde);border-radius:2px;color:var(--marron);font-size:15px;margin-bottom:14px;-webkit-appearance:none;}
.inp:focus{outline:none;border-color:var(--marron2);}
.sbtn{width:100%;padding:16px;border-radius:2px;border:none;font-size:12px;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);letter-spacing:2px;text-transform:uppercase;}
.sbtn.on{background:var(--marron);color:var(--crema);cursor:pointer;}
.sbtn.off{background:var(--borde);color:var(--marron3);cursor:not-allowed;}

/* ── ÉXITO ───────────────────────────────────────────────────── */
.succ{text-align:center;padding:48px 0;}
.succ-icon{font-size:56px;display:inline-block;animation:pop .5s cubic-bezier(.175,.885,.32,1.275);}

/* ── GESTIÓN HEADER ──────────────────────────────────────────── */
.ghdr{background:var(--marron);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.glogo{font-family:var(--font-display);font-size:14px;color:var(--crema);font-weight:300;letter-spacing:4px;text-transform:uppercase;}
.gtabs{background:var(--blanco);border-bottom:1px solid var(--borde);display:flex;padding:0 16px;overflow-x:auto;scrollbar-width:none;}
.gtabs::-webkit-scrollbar{display:none;}
.gtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--marron3);padding:14px 16px;font-size:12px;font-weight:400;cursor:pointer;white-space:nowrap;font-family:var(--font-display);letter-spacing:1.5px;text-transform:uppercase;}
.gtab.on{color:var(--marron);font-weight:600;border-bottom-color:var(--marron);}
.bdg{background:var(--marron2);color:var(--crema);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:600;margin-left:5px;}
.sflt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.sfBtn{padding:7px 14px;border-radius:2px;border:1px solid var(--borde);background:var(--blanco);color:var(--marron2);font-size:11px;cursor:pointer;font-family:var(--font-display);letter-spacing:.5px;text-transform:capitalize;}
.oi{background:var(--blanco);border-radius:2px;padding:14px 16px;margin-bottom:8px;border:1px solid var(--borde);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer;transition:border-color .12s;}
.oi:hover{border-color:var(--marron3);}
.oi-name{font-weight:500;font-size:15px;margin-bottom:3px;color:var(--marron);}
.oi-sub{font-size:12px;color:var(--marron3);}
.oi-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.sbadge{border-radius:2px;padding:3px 10px;font-size:11px;font-weight:600;text-transform:capitalize;font-family:var(--font-display);letter-spacing:.5px;}

/* ── PANEL DETALLE ───────────────────────────────────────────── */
#panel{position:fixed;inset:0;background:var(--blanco);z-index:300;overflow-y:auto;display:none;}
#panel.on{display:block;animation:fadeUp .2s ease;}
.panel-hdr{background:var(--marron);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
.panel-body{padding:20px 18px 100px;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.dcell{background:var(--crema);border-radius:2px;padding:12px 14px;border:1px solid var(--borde);}
.dlbl{font-size:10px;color:var(--marron3);margin-bottom:2px;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-display);}
.dval{font-weight:500;font-size:14px;color:var(--marron);}
.stbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.stbtn{padding:8px 14px;border-radius:2px;font-size:11px;border:1px solid;text-transform:capitalize;cursor:pointer;font-family:var(--font-display);letter-spacing:.5px;}

/* ── PRODUCTOS GESTIÓN ───────────────────────────────────────── */
.pmgmt{background:var(--blanco);border-radius:2px;border:1px solid var(--borde);padding:13px 15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.pmgmt-thumb{width:48px;height:48px;border-radius:2px;object-fit:cover;flex-shrink:0;border:1px solid var(--borde);}
.pmgmt-info{flex:1;min-width:0;}
.pmgmt-name{font-weight:500;font-size:13px;margin-bottom:3px;color:var(--marron);}
.pmgmt-sub{font-size:11px;color:var(--marron3);}
.pmgmt-btns{display:flex;gap:6px;flex-shrink:0;}
.tog-wrap{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.tog{width:40px;height:22px;border-radius:11px;position:relative;transition:background .2s;flex-shrink:0;cursor:pointer;border:none;padding:0;}
.knob{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:white;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}

/* ── FORMULARIO ──────────────────────────────────────────────── */
.peform{background:var(--crema);border-radius:2px;border:1px solid var(--borde);padding:18px;margin-bottom:16px;}
.fgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px;}
@media(min-width:480px){.fgrid{grid-template-columns:1fr 1fr;}}
.fgrid .inp{margin-bottom:0;}
.margen{font-size:10px;font-weight:700;border-radius:2px;padding:2px 8px;display:inline-block;font-family:var(--font-display);letter-spacing:.5px;}

/* ── TABLERO ─────────────────────────────────────────────────── */
.gtab-content{max-width:700px;margin:0 auto;padding:16px 14px 120px;}
.ret-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--borde);}
.ret-row:last-child{border-bottom:none;}
.ret-row.off .ret-inp{color:var(--marron3);background:transparent;}
.ret-inp{flex:1;min-width:0;padding:10px 12px;background:var(--crema);border:1px solid var(--borde);border-radius:2px;color:var(--marron);font-size:15px;font-family:'DM Sans',sans-serif;}
.ret-ico{background:none;border:1px solid var(--borde);border-radius:2px;width:34px;height:38px;cursor:pointer;color:var(--marron2);font-size:14px;flex-shrink:0;}
.ret-ico:disabled{opacity:.3;cursor:default;}
.ret-sw{flex-shrink:0;border:1px solid var(--borde);border-radius:2px;height:38px;padding:0 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:1px;text-transform:uppercase;min-width:84px;}
.ret-sw.on{background:var(--marron);color:var(--crema);border-color:var(--marron);}
.ret-sw.no{background:var(--crema);color:var(--marron3);}
@media(max-width:480px){.ret-sw{min-width:0;padding:0 8px;}.ret-ico{width:30px;}}
.tbtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--marron3);padding:10px 14px;font-size:11px;font-weight:400;cursor:pointer;white-space:nowrap;font-family:var(--font-display);letter-spacing:1.5px;text-transform:uppercase;}
.tbtab.on{color:var(--marron);font-weight:600;border-bottom-color:var(--marron);}
.tbcard{background:var(--blanco);border-radius:2px;border:1px solid var(--borde);padding:16px 18px;margin-bottom:12px;}
.tbcard-titulo{font-family:var(--font-display);font-size:11px;font-weight:600;color:var(--marron);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--crema2);letter-spacing:2px;text-transform:uppercase;}
.tbkpi{background:var(--blanco);border-radius:2px;padding:14px 12px;border:1px solid var(--borde);}
.tbkpi-val{font-family:var(--font-display);font-size:20px;font-weight:300;line-height:1.2;color:var(--marron);}
.tbkpi-lbl{font-size:9px;color:var(--marron3);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;font-family:var(--font-display);}

/* ── LANDING ESPECIAL ────────────────────────────────────────── */
.landing-hdr{background:var(--crema);padding:36px 20px 24px;text-align:center;border-bottom:1px solid var(--borde);}
.pago-btn{flex:1;padding:8px 4px;border:1px solid var(--borde);border-radius:2px;background:white;color:var(--marron2);font-size:11px;cursor:pointer;font-family:var(--font-display);letter-spacing:.5px;transition:all .15s;}
.pago-btn.on{background:var(--marron);color:var(--crema);border-color:var(--marron);}
.local-prod{background:white;border:1px solid var(--borde);border-radius:2px;padding:11px 13px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;transition:border-color .12s;}
.local-prod:hover{border-color:var(--marron2);}
.local-prod-name{font-weight:500;font-size:13px;color:var(--marron);margin-bottom:2px;}
.local-prod-price{font-size:11px;color:var(--marron3);font-family:var(--font-display);}
.local-qty{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.local-qty-btn{width:28px;height:28px;border-radius:2px;border:1px solid var(--borde);background:var(--crema);color:var(--marron);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.local-qty-val{font-weight:600;font-size:15px;color:var(--marron);min-width:18px;text-align:center;font-family:var(--font-display);}
</style>
</head>
<body>

<div id="loading">
  <div style="font-family:var(--font-display);font-size:14px;font-weight:300;color:#2C1A0E;letter-spacing:6px;text-transform:uppercase;margin-bottom:2px">Pachamama</div>
  <div style="font-family:var(--font-display);font-size:22px;font-weight:300;color:#2C1A0E;letter-spacing:8px;text-transform:uppercase;margin-bottom:16px">Culiparri</div>
  <div class="spin"></div>
  <div id="loadingMsg" style="font-size:11px;color:#A88660;margin-top:16px;font-family:var(--font-display);letter-spacing:1px;display:none">Conectando...</div>
  <div id="loadingErr" style="font-size:12px;color:#8B2318;margin-top:12px;font-family:'DM Sans',sans-serif;display:none;max-width:260px;text-align:center">
    No se pudo conectar.<br>Verificá que estés logueado con Google y recargá.
    <br><button onclick="location.reload()" style="margin-top:12px;background:#2C1A0E;color:#F5EDE0;border:none;padding:8px 20px;border-radius:2px;cursor:pointer;font-family:var(--font-display);font-size:11px;letter-spacing:1px">Recargar</button>
  </div>
</div>


<div id="appG" style="display:none">
  <div class="ghdr">
    <div>
      <div class="glogo">Pachamama Culiparri</div>
      <div style="font-size:10px;color:#A88660;letter-spacing:2px;font-family:var(--font-display);text-transform:uppercase">Caja del local</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button onclick="recargarCaja()" title="Actualizar productos y stock" style="background:none;border:1px solid #3a6a2a;border-radius:8px;color:#a8d878;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer">↻</button>
    </div>
  </div>

  <div id="tabCj" class="gtab-content" style="display:block;padding:10px 12px 20px;max-width:none">

  <!-- Layout: productos | carrito -->
  <div style="display:flex;gap:12px;align-items:flex-start;max-width:1100px;margin:0 auto">

    <!-- ── COLUMNA PRODUCTOS (izquierda) ── -->
    <div style="flex:1;min-width:0">

      <!-- Buscador -->
      <input id="cajaBuscar" type="text" placeholder="🔍 Buscar producto..." oninput="filtrarCaja()"
        style="width:100%;padding:11px 14px;border:1.5px solid var(--borde);border-radius:2px;font-size:15px;background:white;font-family:'DM Sans',sans-serif;color:var(--marron);margin-bottom:12px;box-sizing:border-box">

      <!-- Cuadrantes por categoría -->
      <div id="cajaCuadrantes"></div>
    </div>

    <!-- ── COLUMNA CARRITO (derecha, sticky) ── -->
    <div style="width:280px;flex-shrink:0;position:sticky;top:60px;align-self:flex-start">
      <div style="background:white;border:1.5px solid var(--borde);border-radius:2px;overflow:hidden">

        <!-- Header carrito -->
        <div style="background:var(--marron);padding:12px 16px;display:flex;justify-content:space-between;align-items:center">
          <span style="font-family:'Jost',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--crema)">Cuenta</span>
          <button onclick="limpiarCaja()" style="background:none;border:none;color:var(--crema);opacity:.6;font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:1px">↺ Limpiar</button>
        </div>

        <!-- Items del carrito -->
        <div id="cajaCartItems" style="min-height:80px;max-height:35vh;overflow-y:auto;padding:10px 14px"></div>

        <!-- Total -->
        <div style="padding:10px 16px;border-top:1px solid var(--borde);border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center">
          <span style="font-family:'Jost',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--marron2)">Total</span>
          <span id="cajaTotalHdr" style="font-family:'Jost',sans-serif;font-size:24px;font-weight:300;color:var(--marron)">—</span>
        </div>

        <!-- Nombre + nota -->
        <div style="padding:10px 14px 0">
          <input id="cajaNombre" type="text" placeholder="Nombre (opcional)"
            style="width:100%;padding:8px 10px;border:1px solid var(--borde);border-radius:2px;font-size:13px;background:var(--crema);font-family:'DM Sans',sans-serif;color:var(--marron);margin-bottom:6px;box-sizing:border-box">
          <input id="cajaNotaInput" type="text" placeholder="Nota"
            style="width:100%;padding:8px 10px;border:1px solid var(--borde);border-radius:2px;font-size:13px;background:var(--crema);font-family:'DM Sans',sans-serif;color:var(--marron);box-sizing:border-box">
        </div>

        <!-- Medio de pago -->
        <div style="padding:10px 14px 0">
          <div style="font-size:10px;color:var(--marron3);letter-spacing:1.5px;text-transform:uppercase;font-family:'Jost',sans-serif;margin-bottom:6px">Medio de pago</div>
          <div style="display:flex;gap:4px">
            <button onclick="cajaPago('efectivo')"      id="cpago_efectivo"      class="pago-btn on" style="flex:1;font-size:11px;padding:8px 4px">Efectivo</button>
            <button onclick="cajaPago('transferencia')" id="cpago_transferencia" class="pago-btn"    style="flex:1;font-size:11px;padding:8px 4px">Transf.</button>
            <button onclick="cajaPago('qr')"            id="cpago_qr"            class="pago-btn"    style="flex:1;font-size:11px;padding:8px 4px">QR</button>
          </div>
        </div>

        <!-- Botón cobrar -->
        <div style="padding:12px 14px 14px">
          <button onclick="confirmarCaja()" id="cajaConfBtn"
            style="width:100%;background:var(--marron);color:var(--crema);border:none;border-radius:2px;padding:14px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:2px;text-transform:uppercase">✓ Cobrar</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Flash confirmación con resumen del día -->
  <div id="cajaFlash" style="display:none;position:fixed;inset:0;background:rgba(44,26,14,.8);z-index:500;align-items:center;justify-content:center">
    <div style="background:white;border-radius:2px;padding:28px 32px;text-align:center;max-width:340px;width:90%;max-height:90vh;overflow-y:auto">
      <div style="font-size:32px;margin-bottom:8px">✓</div>
      <div style="font-family:'Jost',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--marron2);margin-bottom:4px">Venta registrada</div>
      <div id="cajaFlashTotal" style="font-family:'Jost',sans-serif;font-size:36px;font-weight:300;color:var(--marron);margin-bottom:2px"></div>
      <div id="cajaFlashPago" style="font-size:12px;color:var(--marron3);margin-bottom:20px"></div>
      <div style="background:var(--crema);border-radius:2px;padding:14px;text-align:left;margin-bottom:20px">
        <div style="font-family:'Jost',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--marron2);margin-bottom:10px">Resumen del día</div>
        <div id="cajaFlashDia"></div>
      </div>
      <button onclick="cerrarCajaFlash()"
        style="width:100%;background:var(--marron);color:var(--crema);border:none;border-radius:2px;padding:13px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:2px;text-transform:uppercase">Nueva venta</button>
    </div>
  </div>

</div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
// URL /exec de tu Web App. SOLO se usa cuando el sitio corre en GitHub Pages.
var API_URL = "https://script.google.com/macros/s/AKfycbyPC7qbjXtuPjUEJmcjwvBj_OpOIhwGO0VQkeqew0_TcyIbHTuv76HTe2AWfHgScILnAA/exec";

// ¿Corriendo dentro de Apps Script? Ahí existe google.script.run.
var IS_GAS = (typeof google !== "undefined" && google.script && !!google.script.run);

// ── PAGE MODE ─────────────────────────────────────────────────────
// En Apps Script lo inyecta el template del servidor.
// En GitHub se lee de la URL (?page=rodri / ?page=especiales).
var PAGE_MODE = (function(){
  var map = {rodri:"gestion",especiales:"landing",local:"gestion",gestion:"gestion",landing:"landing",catalogo:"catalogo"};
  var inj = ("<?= page ?>").toLowerCase();
  if (map[inj]) return map[inj];
  var raw = (new URLSearchParams(location.search).get("page") || "").toLowerCase();
  return map[raw] || "catalogo";
})();

// ── CONFIG ────────────────────────────────────────────────────────
// Paleta unificada con la nueva identidad — todos de la familia marrón/ocre
var CAT_META = {
  "Frutas":               {color:"#7A5C3A",bg:"#F5EDE0",icon:"🍌"},
  "Verduras":             {color:"#5C7A3A",bg:"#EEF2E8",icon:"🥬"},
  "Lacteos":              {color:"#5A6A7A",bg:"#EEF0F2",icon:"🧀"},
  "Panificados":          {color:"#8A6A3A",bg:"#F5F0E8",icon:"🍞"},
  "Dulces y Miel":        {color:"#A07830",bg:"#F5EEE0",icon:"🍯"},
  "Almacen":              {color:"#6A5A7A",bg:"#F0EEF5",icon:"🛒"},
  "Carnes":               {color:"#7A3A3A",bg:"#F5EEEE",icon:"🥩"},
  "Carne Vacuna Pastoril":{color:"#6A2A2A",bg:"#F2EEEE",icon:"🐄"},
  "Pollos":               {color:"#8A6A2A",bg:"#F5F0E8",icon:"🐔"},
  "Plantines":            {color:"#4A7A3A",bg:"#EEF5EE",icon:"🌱"},
  "Bolsones":             {color:"#3A6A7A",bg:"#EEF2F5",icon:"📦"},
};
var CAT_COLORS=["#7A5C3A","#5C7A3A","#5A6A7A","#8A6A3A","#A07830","#6A5A7A","#7A3A3A","#6A2A2A","#8A6A2A","#4A7A3A","#3A6A7A"];
var CAT_BGS=["#F5EDE0","#EEF2E8","#EEF0F2","#F5F0E8","#F5EEE0","#F0EEF5","#F5EEEE","#F2EEEE","#F5F0E8","#EEF5EE","#EEF2F5"];
var catColorMap={},colorIdx=0;
function getCatMeta(cat){
  if(CAT_META[cat])return CAT_META[cat];
  if(!catColorMap[cat]){catColorMap[cat]={color:CAT_COLORS[colorIdx%CAT_COLORS.length],bg:CAT_BGS[colorIdx%CAT_BGS.length],icon:"🌿"};colorIdx++;}
  return catColorMap[cat];
}

var marronCol="#7A5C3A";
var SC={pendiente:"#d97706",confirmado:"#2563eb",entregado:"#16a34a",cancelado:"#dc2626"};
var RL={jueves:"Jueves 10 a 18hs",viernes:"Viernes 10 a 18hs",sabado:"Sábado 10 a 18hs",domingo:"Domingo 10 a 13hs",coordinar:"Coordinar con Rodrigo",local:"Local"};
var fmt=function(n){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);};
var products=[],orders=[],cart={},siteConfig={};
var catF="todas",stF="todos",curTab="p",selO=null;
var categorias=[],unidades=[],lastOrder=null;


// ── LLAMADAS AL SERVIDOR (google.script.run) ────────────────────
function apiCall(fn, arg, cb){
  var done=false;
  var timer=setTimeout(function(){
    if(!done){done=true;console.error("timeout",fn);cb(null);}
  },12000);
  var runner = google.script.run
    .withSuccessHandler(function(r){if(!done){done=true;clearTimeout(timer);cb(r);}})
    .withFailureHandler(function(e){if(!done){done=true;clearTimeout(timer);console.error(fn,e);cb(null);}});
  if(arg !== undefined) runner[fn](arg);
  else runner[fn]();
}
function apiGet(action,cb){
  if(action==="getProductos") apiCall("getProductosClient",undefined,function(r){cb(r?JSON.parse(r):null);});
  else if(action==="getPedidos") apiCall("getPedidosClient",undefined,function(r){cb(r?JSON.parse(r):null);});
  else if(action==="getCats") apiCall("getCatsClient",undefined,function(r){cb(r?JSON.parse(r):null);});
}
function apiPost(body,cb){
  var action=body.action, data=body.data?JSON.stringify(body.data):null;
  if(action==="init")            apiCall("initSheetsClient",undefined,function(){cb({ok:true});});
  else if(action==="nuevoPedido")     apiCall("nuevoPedidoClient",data,function(r){cb(r?JSON.parse(r):{ok:true});});
  else if(action==="updateStatus")    apiCall("updateStatusClient2",JSON.stringify({id:body.id,status:body.status}),function(r){cb(r?JSON.parse(r):null);});
  else if(action==="toggleDisp")      apiCall("toggleDispClient",body.id,function(r){cb(r?JSON.parse(r):null);});
  else if(action==="toggleLanding")   apiCall("toggleLandingClient",body.id,function(r){cb(r?JSON.parse(r):null);});
  else if(action==="addProducto")     apiCall("addProductoClient",data,function(r){cb(r?JSON.parse(r):null);});
  else if(action==="updateProducto")  apiCall("updateProductoClient",data,function(r){cb(r?JSON.parse(r):null);});
  else if(action==="deleteProducto")  apiCall("deleteProductoClient",body.id,function(r){cb(r?JSON.parse(r):null);});
}

// ── INIT GESTIÓN ─────────────────────────────────────────────────
var siteConfig={};
function loadProducts(cb){
  apiPost({action:"init"},function(){
    apiCall("getConfigClient",undefined,function(r){if(r)try{siteConfig=JSON.parse(r);}catch(e){}});
    apiCall("getRetiroClient",undefined,function(r){if(r)try{JSON.parse(r).forEach(function(o){RL[o.id]=o.label;});}catch(e){}});
    apiGet("getProductos",function(data){
      products=Array.isArray(data)?data:[];
      products.forEach(function(p){getCatMeta(p.cat);if(categorias.indexOf(p.cat)<0)categorias.push(p.cat);if(unidades.indexOf(p.unidad)<0)unidades.push(p.unidad);});
      apiGet("getCats",function(res){
        if(res&&res.cats){res.cats.forEach(function(c){if(categorias.indexOf(c)<0){categorias.push(c);getCatMeta(c);}});res.units.forEach(function(u){if(unidades.indexOf(u)<0)unidades.push(u);});}
        cb();
      });
    });
  });
}
function initG(){
  loadProducts(function(){
    document.getElementById("loading").style.display="none";
    document.getElementById("appG").style.display="block";
    loadG();
  });
}

// ── CAJA ─────────────────────────────────────────────────────────
var cajaCart={}, cajaPagoActual="efectivo";

function initCaja(){
  if(products&&products.length>0){ renderCuadrantes(); renderCarrito(); }
  else{ loadProducts(function(){ renderCuadrantes(); renderCarrito(); }); }
}

function filtrarCaja(){
  renderCuadrantes();
}


function esUnidadPeso(unidad){
  var u=(unidad||"").toLowerCase().trim();
  return u==="kg"||u==="gr"||u==="g"||u==="1/2 kg"||u==="1/4 kg"||u==="1/2kg"||u==="1/4kg"||u.indexOf("kg")>=0||u.indexOf("gr")>=0;
}

// Renderiza cuadrantes por categoría, orden alfabético dentro de cada una
function renderCuadrantes(){
  var inputEl=document.getElementById("cajaBuscar");
  var q=inputEl?inputEl.value.toLowerCase().trim():"";

  var lista=products.filter(function(p){
    if(!p.disponible)return false;
    if(q&&p.nombre.toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return a.nombre.localeCompare(b.nombre,"es");});

  // Agrupar por categoría
  var cats={};
  lista.forEach(function(p){
    if(!cats[p.cat])cats[p.cat]=[];
    cats[p.cat].push(p);
  });

  if(!Object.keys(cats).length){
    document.getElementById("cajaCuadrantes").innerHTML='<div style="padding:40px;text-align:center;color:var(--marron3);font-size:13px">Sin resultados</div>';
    return;
  }

  var html="";
  Object.keys(cats).sort().forEach(function(cat){
    var m=getCatMeta(cat);
    var prods=cats[cat];
    html+='<div style="margin-bottom:16px">';
    // Header categoría
    html+='<div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:'+m.bg+';border:1px solid '+m.color+'22;border-radius:2px 2px 0 0;border-bottom:2px solid '+m.color+'">'
      +'<span style="font-size:16px">'+m.icon+'</span>'
      +'<span style="font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:'+m.color+'">'+cat+'</span>'
      +'<span style="font-size:11px;color:'+m.color+';opacity:.6;margin-left:auto">'+prods.length+' productos</span>'
      +'</div>';
    // Grid de productos
    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:'+m.color+'22;border:1px solid '+m.color+'22;border-top:none;border-radius:0 0 2px 2px;overflow:hidden">';
    prods.forEach(function(p){
      var en=cajaCart[p.id]||0;
      var agotado=p.stock!==null&&p.stock!==undefined&&p.stock<=0;
      var bg=en>0?m.bg:"white";
      var stockLbl=p.stock!==null&&p.stock!==undefined
        ?'<span style="font-size:9px;color:'+(p.stock<=5?"#d97706":"var(--marron3)")+';display:block;margin-top:1px">'+p.stock+' '+p.unidad+' disp.</span>':'';
      html+='<div style="background:'+bg+';padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px;'+(agotado?'opacity:.45':'')+'transition:background .1s">'
        +'<div>'
        +'<div style="font-weight:500;font-size:13px;color:var(--marron);line-height:1.25">'+p.nombre+'</div>'
        +'<div style="font-size:11px;color:'+m.color+';font-family:var(--font-display)">'+fmt(p.precio)+'<span style="color:var(--marron3)"> / '+p.unidad+'</span></div>'
        +stockLbl
        +'</div>'
        +(agotado
          ?'<div style="font-size:10px;color:#dc2626;font-weight:600;letter-spacing:.5px">⊘ Agotado</div>'
          :(function(){
            var isPeso=esUnidadPeso(p.unidad);
            var s='<div style="display:flex;align-items:center;gap:6px">';
            if(en>0){
              s+='<button onclick="cajaChg('+p.id+',-1)" style="width:26px;height:26px;border-radius:2px;border:1px solid var(--borde);background:white;color:var(--marron);font-size:16px;cursor:pointer;line-height:1;flex-shrink:0">−</button>';
              if(isPeso){
                // Cantidad editable para productos de peso
                s+='<input type="number" id="cajaq_'+p.id+'" value="'+en+'" min="0.001" step="0.001" '
                  +'onchange="cajaSetQ('+p.id+',parseFloat(this.value)||0)" '
                  +'onclick="this.select()" '
                  +'style="width:54px;height:26px;border-radius:2px;border:1px solid '+m.color+';text-align:center;font-size:13px;font-weight:700;color:'+m.color+';background:white;padding:0 4px">';
              }else{
                s+='<span style="font-weight:700;font-size:15px;color:'+m.color+';min-width:18px;text-align:center">'+en+'</span>';
              }
            }
            s+='<button onclick="cajaChg('+p.id+',1)" style="width:26px;height:26px;border-radius:2px;border:1px solid '+(en>0?m.color:'var(--borde)')+';background:'+(en>0?m.color:'white')+';color:'+(en>0?'white':'var(--marron)')+';font-size:16px;cursor:pointer;line-height:1;flex-shrink:0'+(en===0?';margin-left:auto':'')+'">+</button>';
            if(en>0) s+='<span style="font-size:11px;color:var(--marron3);margin-left:auto">'+fmt(p.precio*en)+'</span>';
            s+='</div>';
            return s;
          })())
        +'</div>';
    });
    html+='</div></div>';
  });

  document.getElementById("cajaCuadrantes").innerHTML=html;
}

function cajaSetQ(id,val){
  var p=products.find(function(x){return x.id===id;});if(!p)return;
  var next=Math.max(0,Math.round(val*1000)/1000); // redondear a 3 decimales
  if(p.stock!==null&&p.stock!==undefined&&next>p.stock)next=p.stock;
  if(next<=0)delete cajaCart[id];else cajaCart[id]=next;
  renderCuadrantes();
  renderCarrito();
}

function cajaChg(id,d){
  var p=products.find(function(x){return x.id===id;});if(!p)return;
  var step=esUnidadPeso(p.unidad)?0.5:1; // peso: incrementos de 0.5 kg
  var cur=cajaCart[id]||0,next=Math.max(0,Math.round((cur+d*step)*1000)/1000);
  if(p.stock!==null&&p.stock!==undefined&&next>p.stock)next=p.stock;
  if(next<=0)delete cajaCart[id];else cajaCart[id]=next;
  renderCuadrantes();
  renderCarrito();
}

function renderCarrito(){
  var items=Object.keys(cajaCart).map(function(id){
    var p=products.find(function(x){return x.id==id;});
    return p?{p:p,q:cajaCart[id]}:null;
  }).filter(Boolean);
  var tot=items.reduce(function(s,i){return s+i.p.precio*i.q;},0);

  // Total header
  var totalEl=document.getElementById("cajaTotalHdr");
  if(totalEl)totalEl.textContent=items.length?fmt(tot):"—";

  // Items
  var cartEl=document.getElementById("cajaCartItems");
  if(!cartEl)return;
  if(!items.length){
    cartEl.innerHTML='<div style="padding:12px 0;color:var(--marron3);font-size:12px;text-align:center">Sin productos</div>';
    return;
  }
  cartEl.innerHTML=items.map(function(i){
    var m=getCatMeta(i.p.cat);
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--crema2)">'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:13px;font-weight:500;color:var(--marron);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+i.p.nombre+'</div>'
      +'<div style="font-size:10px;color:var(--marron3)">'+(esUnidadPeso(i.p.unidad)?i.q:i.q)+' '+i.p.unidad+' × '+fmt(i.p.precio)+'</div>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px">'
      +'<span style="font-size:13px;font-weight:600;color:'+m.color+'">'+fmt(i.p.precio*i.q)+'</span>'
      +'<button onclick="cajaChg('+i.p.id+',-1)" style="width:20px;height:20px;border-radius:2px;border:1px solid var(--borde);background:none;color:var(--marron3);font-size:13px;cursor:pointer;line-height:1;padding:0">×</button>'
      +'</div></div>';
  }).join("");
}

function cajaPago(tipo){
  cajaPagoActual=tipo;
  ["efectivo","transferencia","qr"].forEach(function(t){
    var el=document.getElementById("cpago_"+t);
    if(el)el.className="pago-btn"+(t===tipo?" on":"");
  });
}

function limpiarCaja(){
  cajaCart={};
  ["cajaBuscar","cajaNombre","cajaNotaInput"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  cajaPagoActual="efectivo";cajaPago("efectivo");
  renderCuadrantes();renderCarrito();
}

function confirmarCaja(){
  var items=Object.keys(cajaCart).map(function(id){
    var p=products.find(function(x){return x.id==id;});
    return p?{nombre:p.nombre,cantidad:cajaCart[id],unidad:p.unidad,precio:p.precio}:null;
  }).filter(Boolean);
  if(!items.length){alert("Agregá al menos un producto.");return;}
  var tot=items.reduce(function(s,i){return s+i.precio*i.cantidad;},0);
  var nombreEl=document.getElementById("cajaNombre");
  var nombre=(nombreEl&&nombreEl.value.trim())?nombreEl.value.trim():"Local";
  var notaEl=document.getElementById("cajaNotaInput");
  var nota=cajaPagoActual+(notaEl&&notaEl.value.trim()?" · "+notaEl.value.trim():"");
  var status=cajaPagoActual==="transferencia"?"pendiente":"entregado";
  var btn=document.getElementById("cajaConfBtn");
  if(btn){btn.textContent="Guardando...";btn.disabled=true;}
  var data={cliente:nombre,telefono:"-",items:items,total:tot,retiro:"local",nota:nota,origen:"local",status:status};
  google.script.run
    .withSuccessHandler(function(){
      if(btn){btn.textContent="✓ Cobrar";btn.disabled=false;}
      items.forEach(function(item){
        products=products.map(function(p){
          if(p.nombre.toLowerCase()===item.nombre.toLowerCase()&&p.stock!==null&&p.stock!==undefined){
            return Object.assign({},p,{stock:Math.max(0,p.stock-item.cantidad)});
          }
          return p;
        });
      });
      mostrarFlashCaja(tot,nombre);
    })
    .withFailureHandler(function(e){
      if(btn){btn.textContent="✓ Cobrar";btn.disabled=false;}
      alert("Error: "+(e&&e.message?e.message:"Error al guardar"));
    })
    .nuevoPedidoClient(JSON.stringify(data));
}

function mostrarFlashCaja(tot,nombre){
  document.getElementById("cajaFlashTotal").textContent=fmt(tot);
  document.getElementById("cajaFlashPago").textContent=cajaPagoActual.charAt(0).toUpperCase()+cajaPagoActual.slice(1)+(nombre!=="Local"?" · "+nombre:"");
  apiGet("getPedidos",function(peds){
    var hoy=new Date();
    var hoyStr=("0"+hoy.getDate()).slice(-2)+"/"+("0"+(hoy.getMonth()+1)).slice(-2)+"/"+String(hoy.getFullYear()).slice(-2);
    var deHoy=Array.isArray(peds)?peds.filter(function(p){return p.fecha===hoyStr&&p.status!=="cancelado";}):[];
    var totalDia=deHoy.reduce(function(s,p){return s+p.total;},0);
    var localHoy=deHoy.filter(function(p){return p.retiro==="local";});
    var onlineHoy=deHoy.filter(function(p){return p.retiro!=="local";});
    document.getElementById("cajaFlashDia").innerHTML=
      '<div style="font-size:14px;color:var(--marron);margin-bottom:4px"><b>Total del día: '+fmt(totalDia)+'</b></div>'
      +'<div style="font-size:11px;color:var(--marron3)">'+localHoy.length+' venta'+(localHoy.length!==1?"s":"")+" local"+(onlineHoy.length?" · "+onlineHoy.length+" online":"")+'</div>';
    document.getElementById("cajaFlash").style.display="flex";
  });
}

function cerrarCajaFlash(){
  document.getElementById("cajaFlash").style.display="none";
  limpiarCaja();
}




// ── START CAJA ────────────────────────────────────────────────────
function recargarCaja(){products=[];categorias=[];unidades=[];loadProducts(function(){renderCuadrantes();renderCarrito();});}
setTimeout(function(){var el=document.getElementById("loadingMsg");if(el)el.style.display="block";},4000);
setTimeout(function(){var loading=document.getElementById("loading");if(loading&&loading.style.display!=="none"){var el=document.getElementById("loadingErr");if(el)el.style.display="block";var spin=loading.querySelector(".spin");if(spin)spin.style.display="none";}},15000);
loadProducts(function(){
  document.getElementById("loading").style.display="none";
  document.getElementById("appG").style.display="block";
  initCaja();
});
</script>
